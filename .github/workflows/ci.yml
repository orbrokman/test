name: Sentinel SRE AgentOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  lint-typecheck-and-test:
    name: Lint, Typecheck, Unit/Integration Tests & Golden Eval Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check app tests deployment

      - name: Run Mypy type checker
        run: mypy app

      - name: Run unit, integration, and golden evaluation regression suite
        run: pytest --cov=app --cov-report=term-missing

      - name: Run deterministic golden dataset evaluation gate
        run: python -m tests.eval.run_eval --mode offline --min-pass-rate 1.0

  terraform-iac-validation:
    name: Terraform IaC Formatting & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        working-directory: deployment/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init (No Backend) & Validate
        working-directory: deployment/terraform
        run: |
          terraform init -backend=false
          terraform validate

  live-adk-eval-and-deploy:
    name: Live ADK Eval Gate & Staging Deploy (main only, when GCP WIF configured)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    needs: [lint-typecheck-and-test, terraform-iac-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run Live ADK Golden Evaluation Suite
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION || 'us-central1' }}
          GOOGLE_GENAI_USE_VERTEXAI: "true"
        run: |
          adk eval app tests/eval/evalsets/sre_incident_golden.evalset.json \
            --config_file_path tests/eval/eval_config.json

      - name: Deploy to Vertex AI Agent Engine
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          python -m deployment.deploy_agent_engine \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --location "${{ vars.GCP_REGION || 'us-central1' }}" \
            --staging-bucket "gs://${{ vars.GCP_PROJECT_ID }}-sentinel-sre-agent-artifacts"
