[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sre-agent"
version = "1.0.0"
description = "Enterprise SRE Incident & Remediation Multi-Agent System built with Google ADK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Or Brokman" }]
keywords = ["google-adk", "multi-agent", "agentops", "sre", "vertex-ai", "opentelemetry"]

dependencies = [
    "google-adk>=1.14.0",
    "google-genai>=1.36.0",
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "google-cloud-secret-manager>=2.21.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-modelarmor>=0.2.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.112.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.agents-cli]
project_name = "sentinel-sre-agent"
agent_directory = "app"
deployment_target = "cloud_run"
cicd_runner = "github_actions"
region = "us-central1"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "S105"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
